# Calls the game server every 10 minutes so Render's free plan never puts it
# to sleep. The server also calls itself, so this is the backup.
name: Keep the server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health check
        run: |
          # A sleeping server can take about a minute to wake, so wait up to 90 seconds.
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            https://discord-card-games.onrender.com/api/health
